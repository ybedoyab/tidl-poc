name: python-ci

on:
  push:
  pull_request:

jobs:
  test-and-sim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Unit tests
        run: pytest
      - name: Fast simulations and metadata schema
        run: python -m tidl_poc sim --fast --verify-schema
      - name: Confirm Vivado is not required
        run: python -c "print('CI completed without Vivado')"

    # Do not upload or commit outputs/. They are model-based simulation artefacts.
